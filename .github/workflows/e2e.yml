name: e2e

on:
  push:
    branches:
      - '**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Smoke test Prism mock server
        working-directory: frontend
        run: |
          npm run mock -- --host 127.0.0.1 --port 4010 > prism-mock.log 2>&1 &
          prism_pid=$!
          trap 'kill "${prism_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4010/api/event-types > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat prism-mock.log
          exit 1

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: e2e
        env:
          E2E_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
